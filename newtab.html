<html lang="tr"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'unsafe-inline' file:"><script src="i18n.js"></script><title>Yeni sekme</title><style>:root{--bg:#fff;--ink:#777}@media(prefers-color-scheme:dark){:root{--bg:#202124;--ink:#777}}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg)}main{height:100%;display:flex;justify-content:center;align-items:center;padding-bottom:18vh}svg{width:88px;height:88px;color:var(--ink);opacity:.65}</style></head><body><main><svg viewBox="0 0 24 24" role="img" aria-label="Calcium"><g transform="rotate(-45 12 12)" fill="currentColor"><rect x="5" y="9" width="14" height="6" rx="2"/><circle cx="5" cy="9" r="3"/><circle cx="5" cy="15" r="3"/><circle cx="19" cy="9" r="3"/><circle cx="19" cy="15" r="3"/></g></svg></main><script>const api=window.pageApi;function theme(d){const st=document.documentElement.style;if(d.theme)st.setProperty('--bg',d.theme.page);else st.removeProperty('--bg')}if(api){api.get().then(theme);api.onUpdate(theme)}</script></body></html>
