name: Release builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tools/test-custom-shortcuts.cjs
      - name: Prepare Windows test runtime
        if: matrix.platform == 'win'
        run: node node_modules/electron/install.js
      - name: Real Windows installer update lifecycle
        if: matrix.platform == 'win'
        timeout-minutes: 10
        run: node tools/test-windows-update.cjs
      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Windows packaged smoke test
        if: matrix.platform == 'win'
        timeout-minutes: 5
        run: node tools/test-packaged.cjs dist/win-unpacked/Calcium.exe
      - name: macOS packaged smoke test
        if: matrix.platform == 'mac'
        timeout-minutes: 5
        run: node tools/test-packaged.cjs dist/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Calcium.app/Contents/MacOS/Calcium
      - uses: actions/upload-artifact@v4
        with:
          name: Calcium-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
          if-no-files-found: error
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Hash and publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          test -f "release-assets/Calcium-Setup-$version.exe"
          test -f "release-assets/Calcium-$version-x64.dmg"
          test -f "release-assets/Calcium-$version-arm64.dmg"
          (cd release-assets && sha256sum *.exe *.dmg *.blockmap > SHA256SUMS.txt)
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Calcium $version" --notes-file "docs/release-$version.md" --draft
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --latest
