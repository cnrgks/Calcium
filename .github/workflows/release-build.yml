name: Release builds
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['package.json']
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: node tools/test-window-placement.cjs
      - name: Prepare Windows test runtime
        if: matrix.platform == 'win'
        run: node node_modules/electron/install.js
      - name: Pinned extension removal menu
        if: matrix.platform == 'win'
        timeout-minutes: 5
        run: node tools/run-electron-tests.cjs test-extension-menu.cjs
      - name: Pentest browser regressions
        if: matrix.platform == 'win'
        timeout-minutes: 5
        run: node tools/run-electron-tests.cjs test-pentest-electron.cjs
      - name: Update download progress card
        if: matrix.platform == 'win'
        timeout-minutes: 5
        run: node tools/run-electron-tests.cjs test-update-progress.cjs
      - name: Real Windows installer update lifecycle
        if: matrix.platform == 'win'
        timeout-minutes: 10
        run: node tools/test-windows-update.cjs
      - name: Scrollbar and extension compatibility regressions
        timeout-minutes: 5
        run: node tools/run-electron-tests.cjs test-private-window-mode.cjs test-tab-lifecycle.cjs test-scrollbar.cjs test-ui-regressions.cjs test-extension-compat.cjs
      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Windows packaged smoke test
        if: matrix.platform == 'win'
        timeout-minutes: 5
        run: node tools/test-packaged.cjs dist/win-unpacked/Calcium.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Calcium-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
  release:
    needs: package
    runs-on: ubuntu-latest
    concurrency:
      group: calcium-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Hash and publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$tag"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          fi
          test -f "release-assets/Calcium-Setup-$version.exe"
          (cd release-assets && sha256sum *.exe *.blockmap > SHA256SUMS.txt)
          if release_state=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            test "$release_state" = true || { echo 'Published releases are immutable; increment the version.' >&2; exit 1; }
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Calcium $version" --notes-file "docs/release-$version.md" --draft
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --latest
