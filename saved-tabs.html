<style>

.popup main{display:flex;flex:1;flex-direction:column;overflow:hidden}.popup #capture{flex:1;min-height:0}.popup #capture>.card{flex:0 1 auto;overflow:auto;min-height:0}.popup .capture-footer{margin-top:auto;padding-top:4px}.new-group-drop{height:90px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-style:dashed;margin-bottom:12px}.new-group-drop span{font-size:32px;font-weight:300}.new-group-drop.drop-target{color:var(--accent);border-style:solid;background:color-mix(in srgb,var(--accent) 6%,var(--card));outline:1px solid var(--accent)}
